name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS because the build is darwin-only: watch/term.go uses TIOCGETA, which is
    # BSD-only, so a linux runner cannot compile board at all.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No go.sum to key a cache on, because there are no dependencies (§2). Left
          # on, setup-go warns about the missing file on every single run, and a
          # permanent warning is one nobody reads.
          cache: false

      # The runner is the outsider machine — no cmux, no claude, no maki — which is what
      # makes every degraded path below a fact rather than an argument. Asserted, not
      # assumed: a runner image that started shipping any of them would silently stop
      # being a test bed, and nothing else here would notice.
      - name: no upstream is installed
        run: |
          for tool in claude cmux maki; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is on PATH; this job is no longer the outsider machine"
              exit 1
            fi
          done

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # -count=1 defeats the test cache. A cached pass carries the verdict from whatever
      # machine produced it, and here the machine is the variable under test (EVIDENCE.md
      # §9.24).
      - name: go test
        run: go test -count=1 ./...

      # The suite must mutate nothing: golden frames are re-blessed by hand with a
      # reason (BLESS=1) or not at all.
      - name: the tests changed no tracked file
        run: git diff --exit-code

      - run: go build -o board ./cmd/board

      # version is the one command whose whole job is to work on a broken machine, and
      # on this runner both upstreams genuinely are missing.
      - name: version reports both upstreams as absent
        run: |
          ./board version
          # ` +` not ` `: the label is padded to a fixed width, so `cmux` is followed by
          # three spaces and `claude` by one. A single-space pattern passes for one row
          # and fails for the other.
          ./board version | grep -qE '^claude +not found$'
          ./board version | grep -qE '^cmux +not found$'

      # -h is the first thing a stranger types, and it is asserted here rather than only in
      # a unit test because the stream and the exit code are the part that reads as broken.
      - name: -h answers on stdout and exits 0
        run: |
          for form in -h --help help; do
            ./board $form | grep -q '^usage: board'
          done
          # Nothing may go to stderr when board was asked a question, not given a wrong one.
          test -z "$(./board -h 2>&1 >/dev/null)"
          # The trap §9.31 closed: todo joins its arguments into text, so this used to
          # write a todo called "-h" and exit 0.
          ./board todo -h | grep -q '^usage: board'
          test ! -e "$HOME/.board.json"
          # An unrecognised command stays an error, on stderr, with a non-zero status.
          if ./board bogus 2>/dev/null; then
            echo "::error::an unrecognised command exited 0"
            exit 1
          fi

      # This runner is the unreadable world, so it is the one place the degraded reports
      # can be checked against a real machine rather than a fixture. §9.26 was found by
      # running the binary with a stripped PATH; this is that check, kept.
      - name: doctor diagnoses a machine with neither upstream
        run: |
          ./board doctor
          ./board doctor | grep -qE '^roster +claude not found$'
          ./board doctor | grep -qE '^tabs +cmux not found$'
          # doctor's output is pasted into bug reports; notify_cmd never appears in it.
          ./board doctor | grep -qE '^notify +off'

      - name: the board says why it is empty, not just that it is
        run: |
          ./board
          ./board | grep -q 'claude not found · board doctor'
          # "no sessions" is a claim about the fleet and would be a lie here.
          if ./board | grep -q 'no live agent sessions'; then
            echo "::error::board reported an empty fleet on a machine it could not read"
            exit 1
          fi
